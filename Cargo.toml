[package]
name = "llmdeals"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
env_logger = "0.10"
log = "0.4"
